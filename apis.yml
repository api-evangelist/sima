name: SiMa
description: >-
  SiMa.ai is a Silicon Valley machine-learning semiconductor company building a
  co-optimized hardware and software platform for physical AI at the edge. Its
  MLSoC (Machine Learning System-on-Chip) family — including the Modalix line
  delivering roughly 50 TOPS under 10 watts in multiple form factors — targets
  drones, robotics, automotive, industrial, retail, government, and healthcare.
  The developer experience centers on the Palette software suite and an agentic
  development environment that compiles and deploys computer-vision and
  multimodal models onto SiMa silicon, backed by a Developer Center, a model
  browser, a Hugging Face model hub (simaai), and a community forum. SiMa.ai
  ships downloadable SDK/CLI tooling and evaluation hardware (Modalix DevKit)
  rather than a hosted public HTTP API.
